interface:
  display_name: "JobMatchFlow Apply"
  short_description: "Prepare and track applications in external Chrome"
  brand_color: "#2563EB"
  default_prompt: "Use $jobmatchflow-apply. Confirm my JobMatchFlow profile and resumes are current, refresh this pulse's local cache, sync my job inbox, and continue my Saved applications."

dependencies:
  tools:
    - type: "mcp"
      value: "jobmatchflow"
      description: "JobMatchFlow jobs, candidate data, resumes, answers, and application tracking"

policy:
  allow_implicit_invocation: true
