interface:
  display_name: "jobfishing Materials Setup"
  short_description: "Configure the shared local LaTeX toolchain"
  brand_color: "#2563EB"
  default_prompt: "Use $jobfishing-materials-setup to check and, only if necessary, configure my system-wide jobfishing LaTeX environment."

dependencies:
  tools:
    - type: "mcp"
      value: "jobfishing"
      description: "jobfishing candidate and application data used after local environment setup"

policy:
  allow_implicit_invocation: true
