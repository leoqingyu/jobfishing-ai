[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfishing-agent"
version = "0.6.0"
description = "Local MCP bridge for jobfishing application sessions"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.1,<3",
  "python-docx>=1.1,<2",
  "requests>=2.32,<3",
]

[project.scripts]
jobfishing-mcp = "jobfishing_mcp_server:main"

[tool.setuptools]
py-modules = ["jobfishing_mcp_server"]
package-dir = {"" = "scripts"}
